<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Shrikhand';src:url(../assets/fonts/shrikhand-400-latin.woff2) format('woff2')}
@font-face{font-family:'Mukta';font-weight:500;src:url(../assets/fonts/mukta-500-latin.woff2) format('woff2')}
@font-face{font-family:'Mukta';font-weight:800;src:url(../assets/fonts/mukta-800-latin.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;background:#1b0d0a;overflow:hidden}
.photo{position:absolute;inset:0 0 0 560px;background:url(../assets/img/cakes/red-velvet-heart-900.webp) 50% 55%/cover;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%)}
.copy{position:absolute;left:64px;top:56px;width:640px;color:#fff3e6}
img{width:120px;height:120px;display:block}
h1{font-family:Shrikhand;font-weight:400;font-size:68px;line-height:.98;margin:30px 0 0;letter-spacing:-.01em}
p{font-family:Mukta;font-weight:500;font-size:28px;margin:26px 0 0;color:#ffb547}
small{display:block;font-family:Mukta;font-weight:500;font-size:22px;margin-top:10px;color:#cbb19e}
</style></head><body>
<div class="photo"></div>
<div class="copy">
  <img src="../assets/brand/cako-badge.svg" alt="">
  <h1>Cakes till midnight in Bibvewadi</h1>
  <p>Open every day, 11 am to 12 midnight</p>
  <small>Upper Kondhwa Road, Pune. Vegetarian only.</small>
</div>
</body></html>
